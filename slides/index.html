<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentic AI for Research Workflows</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/white.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/monokai.css">

  <style>
    :root {
      --berkeley-blue: #003262;
      --california-gold: #FDB515;
      --r-heading-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --r-main-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --r-code-font: "SF Mono", Menlo, Consolas, monospace;
      --r-heading-color: var(--berkeley-blue);
      --r-link-color: #1a6bab;
      --r-main-font-size: 38px;
    }
    .reveal h1, .reveal h2, .reveal h3 {
      text-transform: none;
      font-weight: 650;
      letter-spacing: -0.01em;
    }
    .reveal h1 { font-size: 2.2em; }
    .reveal h2 { font-size: 1.4em; margin-bottom: 0.8em; }
    .reveal .slides section {
      text-align: left;
    }
    .reveal .slides section.center-slide {
      text-align: center;
    }
    .reveal p, .reveal li { line-height: 1.45; }
    .reveal ul { display: block; margin-left: 0.8em; }
    .reveal li { margin-bottom: 0.4em; }
    .reveal pre {
      width: 100%;
      box-shadow: none;
      border-radius: 8px;
      font-size: 0.62em;
      line-height: 1.4;
    }
    .reveal pre code { padding: 0.9em 1.1em; border-radius: 8px; }
    .reveal code { color: #b3550e; }
    .reveal pre code { color: #f8f8f2; }
    .reveal blockquote {
      border-left: 4px solid var(--california-gold);
      background: none;
      box-shadow: none;
      padding-left: 0.8em;
      font-style: normal;
      margin-left: 0;
      width: 100%;
    }
    .reveal table { font-size: 0.85em; }
    .reveal table th { color: var(--berkeley-blue); }
    .reveal table th, .reveal table td { padding: 0.35em 0.8em; }
    .reveal .subtitle { color: #666; font-size: 0.75em; margin-top: 1.5em; }
    .reveal .logo { height: 260px; margin: 0 0 0.5em; box-shadow: none; }
    .reveal .logo-end { height: 200px; margin-top: 1em; }
    .reveal .muted { color: #888; font-size: 0.8em; }
    .gold { color: #c98a00; }
    .reveal .screenshot {
      max-height: 440px;
      max-width: 100%;
      display: block;
      margin: 0 auto 0.6em;
      border-radius: 10px;
      box-shadow: 0 10px 35px rgba(0, 20, 60, 0.25);
    }
    .reveal .chat {
      width: 82%;
      margin: 0 auto 0.8em;
      font-size: 0.58em;
    }
    .reveal .chat .msg {
      border-radius: 14px;
      padding: 0.6em 1em;
      margin: 0.55em 0;
      line-height: 1.45;
    }
    .reveal .chat .user { background: #e7eef6; margin-left: 22%; }
    .reveal .chat .bot { background: #f4f4f4; margin-right: 22%; }
    .reveal .chat code {
      background: rgba(0, 0, 0, 0.06);
      padding: 0 0.25em;
      border-radius: 4px;
      font-size: 0.95em;
    }
    .reveal .chat .codebox {
      background: #1c1d21;
      border-radius: 8px;
      margin: 0.5em 0;
      overflow: hidden;
    }
    .reveal .chat .codebar {
      display: flex;
      justify-content: space-between;
      background: #35363c;
      color: #c4c4c4;
      font-family: var(--r-code-font);
      font-size: 0.72em;
      padding: 0.35em 1em;
    }
    .reveal .chat .codebox pre {
      margin: 0;
      padding: 0.6em 1em;
      width: auto;
      font-size: 0.9em;
      color: #f0f0f0;
      background: none;
      box-shadow: none;
    }
    .reveal .appwin {
      width: 86%;
      margin: 0 auto 0.8em;
      font-size: 0.55em;
      background: #1e1f24;
      color: #d8d8d8;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 10px 35px rgba(0, 20, 60, 0.25);
    }
    .reveal .appwin .titlebar {
      display: flex;
      align-items: center;
      gap: 0.9em;
      background: #2b2c31;
      color: #9a9a9a;
      font-size: 0.85em;
      padding: 0.45em 1em;
    }
    .reveal .appwin .dots i {
      display: inline-block;
      width: 0.65em;
      height: 0.65em;
      border-radius: 50%;
      background: #55565c;
      margin-right: 0.35em;
    }
    .reveal .appwin .appbody { display: flex; }
    .reveal .appwin .sidebar {
      width: 24%;
      background: #26272c;
      padding: 0.8em 0.6em;
    }
    .reveal .appwin .thread {
      padding: 0.35em 0.7em;
      border-radius: 6px;
      color: #9a9a9a;
      margin-bottom: 0.3em;
    }
    .reveal .appwin .thread.active { background: #3a3b41; color: #fff; }
    .reveal .appwin .mainpane { flex: 1; padding: 0.9em 1.2em; }
    .reveal .appwin .msg.user {
      background: #33415e;
      color: #eef2f8;
      border-radius: 12px;
      padding: 0.5em 0.9em;
      margin: 0 0 0.7em 22%;
    }
    .reveal .appwin .step {
      font-family: var(--r-code-font);
      font-size: 0.88em;
      color: #9aa4b2;
      margin: 0.35em 0;
      padding-left: 1em;
      text-indent: -1em;
    }
    .reveal .appwin .step::before { content: "▸ "; color: #6b7280; }
    .reveal .appwin .step.err::before { content: "✗ "; color: #e0656a; }
    .reveal .appwin .step.err { color: #cfa0a3; }
    .reveal .appwin .step.ok::before { content: "✓ "; color: #6fbf82; }
    .reveal .appwin .reply { margin-top: 0.7em; color: #e6e6e6; }
    .reveal .appwin code {
      background: rgba(255, 255, 255, 0.08);
      color: #d8d8d8;
      padding: 0 0.25em;
      border-radius: 4px;
      font-size: 0.95em;
    }
    .reveal .progress { color: var(--california-gold); }
    .reveal .controls { color: var(--berkeley-blue); }
  </style>
</head>
<body>
  <div class="reveal">
    <div class="slides">
      <section data-markdown="slides.md"
               data-separator="^\r?\n---\r?\n$"
               data-separator-notes="^Note:"
               data-charset="utf-8">
      </section>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/markdown/markdown.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/highlight/highlight.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.js"></script>
  <script>
    Reveal.initialize({
      hash: true,
      slideNumber: 'c/t',
      transition: 'none',
      width: 1100,
      height: 700,
      margin: 0.08,
      plugins: [RevealMarkdown, RevealHighlight, RevealNotes]
    });
  </script>
</body>
</html>
